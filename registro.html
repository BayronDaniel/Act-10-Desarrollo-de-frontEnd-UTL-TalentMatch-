<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTL TalentMatch | Registro</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS propio -->
    <link rel="stylesheet" href="CSS/miEstilo.css">
</head>
<body>
    <main class="auth-page d-flex align-items-center justify-content-center p-3 py-5">
      <a class="brand position-absolute top-0 start-0 m-3" href="index.html">
            <span class="brand-mark">
                  <i class="bi bi-people-fill"></i>
            </span>
            <span>UTL TalentMatch</span>
      </a>

      <section class="auth-card card border-0 shadow-lg p-4 p-md-5 my-5">
            <div class="text-center mb-4">
                  <p class="eyebrow mb-1">Comienza aquí</p>
                  <h1 class="page-title h2 mb-1">Crear perfil</h1>
                  <p class="text-secondary small mb-0">Completa tus datos para conocer oportunidades</p>
            </div>
            <form action="#" method="get" class="row g-3">
                  <div cass="col-sm-8">
                        <label for="nombre" class="form-label">Nombre completo</label> <!-- from-label da forma a las etiquetas -->
                        <input class="form-control" id="nombre" name="nombre" type="text" placeholder="Tu nombre" required>
                  </div>
                  <div class="col-sm-4">
                        <label for="edad" class="form-label">Edad</label>
                        <input type="number" class="form-control" id="edad" name="edad" min="20" max="80" placeholder="Edad" required>
                  </div>
                  <div class="col-12">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@correo.com" required>
                  </div>
                  <div class="col-12">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contraseña" placeholder="Crea una contraseña" required>
                  </div>
                  <div class="col-12">
                        <label for="carrera" class="form-label">Carrera</label>
                        <select name="carrera" id="carrera" class="form-select" required>
                        <option value="" selected disabled>Selecciona tu carrera</option>
                              <option>Ingeniería en Software</option>
                              <option>Desarrollo de Software Multiplataforma</option>
                              <option>Entornos Virtuales y Negocios Digitales</option>
                              <option>Mercadotecnia</option>
                              <option>Otra</option>
                        </select>
                  </div>
                  <div class="col-12 d-grid mt-4">
                        <button class="btn btn-primary" type="submit">Crear cuenta</button>
                  </div>
            </form>
            <p class="text-center small mt-3 mb-1">¿Ya tienes una cuenta?
                  <a href="login.html" class="fw-bold">Iniciar sesión</a>
            </p>

            <p class="text-center small mb-0">
                  <a href="index.html" class="text-secondary">Volver al inicio</a>
            </p>
      </section>
      <footer>
            © 2026 UTL TalentMatch · Cuatro sin control - Desarrollador:
      <strong>Bayron Daniel</strong>
      </footer>
    </main>
</body>
</html>
