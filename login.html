<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTL TalentMatch | Iniciar sesión</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS propio -->
    <link rel="stylesheet" href="CSS/miEstilo.css">
</head>
<body>
    <main class="auth-page d-flex align-items-center justify-content-center p-3 py-5">
      <a href="index.html" class="brand position-absolute top-0 start-0 m-3 m-lg-4">
            <span class="brand-mark">
                  <i class="bi bi-people-fill"></i>
            </span>
            UTL TalentMatch
      </a>

      <section class="auth-card">
            <div class="text-center mb-4">
                  <span class="brand-mark mx-auto mb-3">
                        <i class="bi bi-person-check"></i>
                  </span>
                  <h1 class="page-title h2 mb-2">Bienvenido a UTL TalentMatch</h1>
                  <p class="subtitle">Inicia sesión para continuar.</p>
            </div>
            <form action="#" >
                  <div class="mb-3">
                        <label for="correo" class="form-label">Correo electronico</label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@correo.com" required>
                  </div>
                  <div class="mb-3">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contraseña" name="contraseña" placeholder="Contraseña" required>
                  </div>
                  <div class="d-grid mt-4">
                        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
                  </div>
            </form>
            <p class="text-center small mt-3 mb-1">
                  ¿No tienes cuenta?
                  <a href="registro.html" class="fw-bold">Crear cuenta</a>
            </p>
            <p class="text-center small">
                  <a href="index.html" class="text-secondary">Volver al inicio</a>
            </p>
      </section>
      <footer>
            © 2026 UTL TalentMatch · Cuatro sin control - Desarrollador:
      <strong>Bayron Daniel</strong>
      </footer>
    </main>
</body>
</html>
