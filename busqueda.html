
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTL TalentMatch | Búsqueda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/miEstilo.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-1 menu">
                <a href="dashboard.html" title="Inicio">
                    <i class="bi bi-house-fill"></i>
                </a>
                <a href="index.html" title="Buscar empleos">
                    <i class="bi bi-search"></i>
                </a>
                <a href="favoritos.html" title="Favoritos">
                    <i class="bi bi-star-fill"></i>
                </a>
                <a href="perfil.html" title="Perfil">
                    <i class="bi bi-person-fill"></i>
                </a>
            </div>
           
            <div class="col-11 contenido">                
                <div class="busqueda">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="¿Qué empleo estás buscando?">
                </div>
                
                <div class="filtros">
                    <h2>Personaliza tu empleo</h2>
                    <form action="resultados.html" method="get">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" name="categoria" class="form-select">
                            <option value=""></option>
                            <option value="tecnologia">Tecnología</option>
                            <option value="diseno">Diseño</option>
                            <option value="administracion">Administración</option>
                            <option value="marketing">Marketing</option>
                        </select>
                        <label for="modalidad">Modalidad:</label>

                        <select id="modalidad" name="modalidad" class="form-select">
                            <option value=""></option>
                            <option value="presencial">Presencial</option>
                            <option value="remoto">Remoto</option>
                            <option value="hibrido">Híbrido</option>
                        </select>
                        <label for="tipo">Tipo de empleo:</label>

                        <select id="tipo" name="tipo" class="form-select">
                            <option value=""></option>
                            <option value="tiempo-completo">Tiempo completo</option>
                            <option value="medio-tiempo">Medio tiempo</option>
                            <option value="practicas">Prácticas profesionales</option>
                        </select>
                        <label for="salario">Salario mínimo:</label>

                        <select id="salario" name="salario" class="form-select salario">
                            <option value=""></option>
                            <option value="5000">$5,000</option>
                            <option value="8000">$8,000</option>
                            <option value="10000">$10,000</option>
                            <option value="15000">$15,000</option>
                        </select>

                        <button type="submit" class="btn btn-primary">
                            Buscar empleos
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer class="app-footer">
        © 2026 UTL TalentMatch · Cuatro sin control - Desarrolladora:
        <strong>Cristina Sanchez</strong>
    </footer>
</body>
</html>
